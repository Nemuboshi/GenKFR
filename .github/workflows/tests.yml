name: Tests

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  FFMPEG_VERSION: '9.0.2'
  XVIDCORE_VERSION: '1.3.7'
  NASM_VERSION: '2.16.03'
  LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'

jobs:
  asan:
    name: Rust and native ASan (C paths)
    runs-on: ubuntu-24.04
    env:
      LIBCLANG_PATH: '/usr/lib/llvm-18/lib'
      GENKFR_ASAN: '1'
      ZLIB_VERSION: '1.3.2'
      CC: clang
      CXX: clang++
      RUSTFLAGS: '-Zsanitizer=address -Zexternal-clangrt -C linker=clang++ -C link-arg=-fsanitize=address -C force-frame-pointers=yes'
      RUSTDOCFLAGS: '-Zsanitizer=address -Zexternal-clangrt -C linker=clang++ -C link-arg=-fsanitize=address'
      ASAN_OPTIONS: 'detect_leaks=1:detect_stack_use_after_return=1:strict_string_checks=1:exitcode=86'
      CARGO_TARGET_DIR: '${{ github.workspace }}/target/asan-linux'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: rust-src
          rustflags: '${{ env.RUSTFLAGS }}'

      - name: Install build and fixture tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm libclang-dev autoconf automake libtool pkg-config ffmpeg

      - name: Verify Rust and native ASan detection
        run: bash .github/scripts/test-asan-runtime.sh

      - name: Build instrumented media libraries without assembly
        run: bash .github/scripts/build-asan-libs.sh

      - name: Test instrumented Rust, standard library and native libraries
        run: |
          export FFMPEG_DIR="$RUNNER_TEMP/asan-prefix"
          export XVIDCORE_DIR="$FFMPEG_DIR/lib"
          cp "$FFMPEG_DIR/include/xvid.h" "$XVIDCORE_DIR/"
          cargo +nightly test -Zbuild-std --target x86_64-unknown-linux-gnu --workspace --release --locked
          cargo +nightly build -Zbuild-std --target x86_64-unknown-linux-gnu --release --locked
          export GENKFR_ASAN_BIN="$CARGO_TARGET_DIR/x86_64-unknown-linux-gnu/release/genkfr"
          bash .github/scripts/test-asan-media.sh

      - name: Save sanitizer logs and native configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-diagnostics
          path: |
            ${{ runner.temp }}/asan-runtime/*.log
            ${{ runner.temp }}/asan-corpus/*.log
            ${{ runner.temp }}/asan-prefix/xvid-platform.inc
            ${{ runner.temp }}/asan-prefix/config.h
            ${{ runner.temp }}/asan-prefix/config.mak

  test:
    name: Windows tests
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Test release asset lookup
        run: bash .github/scripts/test-ffmpeg-asset.sh

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Download the FFmpeg libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ffmpeg-libs-$FFMPEG_VERSION"
          dir="$(cygpath -u "$RUNNER_TEMP")/ffmpeg"
          mkdir -p "$dir"
          gh release download "$tag" --pattern "$tag.zip" --dir "$dir" --clobber
          7z x "$dir/$tag.zip" "-o$(cygpath -w "$dir")" -y
          [[ -d "$dir/include" ]] || { echo 'the archive has no include directory' >&2; exit 1; }
          [[ -d "$dir/lib" ]] || { echo 'the archive has no lib directory' >&2; exit 1; }

      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build xvidcore
        run: bash .github/scripts/build-xvid.sh

      - name: Test genkfr
        run: |
          export FFMPEG_DIR="$(cygpath -m "$RUNNER_TEMP")/ffmpeg"
          export XVIDCORE_DIR="$(cygpath -m "$RUNNER_TEMP")"
          export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER="$(cygpath -m "$VCToolsInstallDir")/bin/Hostx64/x64/link.exe"
          cargo test --workspace --release --locked
