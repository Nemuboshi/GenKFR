name: Windows Release

# Builds a single genkfr.exe with no DLL files beside it.
# FFmpeg is downloaded from a release asset. If missing, start its separate
# workflow and wait for it. xvidcore is built here; build.rs compiles FFMS2.

on:
  push:
    tags:
      - 'v-*'
  workflow_dispatch:

permissions:
  contents: write
  # GITHUB_TOKEN can start a separate workflow_dispatch run.
  actions: write

defaults:
  run:
    shell: bash

env:
  FFMPEG_VERSION: '9.0.2'
  XVIDCORE_VERSION: '1.3.7'
  NASM_VERSION: '2.16.03'

jobs:
  build:
    name: Build genkfr
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Test release asset lookup
        run: bash .github/scripts/test-ffmpeg-asset.sh

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Download the FFmpeg libraries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="ffmpeg-libs-$FFMPEG_VERSION"
          dir="$(cygpath -u "$RUNNER_TEMP")/ffmpeg"
          mkdir -p "$dir"
          found="$(bash .github/scripts/ffmpeg-asset.sh "$tag")"

          if [[ "$found" != true ]]; then
            echo "release $tag has no expected asset, starting the FFmpeg build"
            start="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            gh workflow run ffmpeg-libs.yml --ref "$GITHUB_REF_NAME" -f "version=$FFMPEG_VERSION"

            # shortcut: stop after 60 minutes; raise this if cold builds need longer.
            deadline=$((SECONDS + 3600))
            while true; do
              found="$(bash .github/scripts/ffmpeg-asset.sh "$tag")"
              [[ "$found" == true ]] && break
              (( SECONDS < deadline )) || { echo "the FFmpeg build did not publish $tag within 60 minutes" >&2; exit 1; }
              sleep 30

              # Only consider completed dispatches from this ref, not old runs.
              run="$(gh run list --workflow ffmpeg-libs.yml --branch "$GITHUB_REF_NAME" \
                --event workflow_dispatch --status completed --limit 1 \
                --json createdAt,conclusion,url \
                --jq '.[0] | select(. != null) | [.createdAt, .conclusion, .url] | @tsv')"
              IFS=$'\t' read -r created conclusion url <<< "$run"
              if [[ -n "$run" && ( "$created" > "$start" || "$created" == "$start" ) ]]; then
                found="$(bash .github/scripts/ffmpeg-asset.sh "$tag")"
                if [[ "$found" != true ]]; then
                  echo "the FFmpeg build ended without an asset: $url ($conclusion)" >&2
                  exit 1
                fi
              fi
            done
            echo "release $tag is ready"
          fi

          gh release download "$tag" --pattern "$tag.zip" --dir "$dir" --clobber
          7z x "$dir/$tag.zip" "-o$(cygpath -w "$dir")" -y
          [[ -d "$dir/include" ]] || { echo 'the archive has no include directory' >&2; exit 1; }
          [[ -d "$dir/lib" ]] || { echo 'the archive has no lib directory' >&2; exit 1; }
          echo "FFmpeg libraries from $tag"
          if [[ -f "$dir/PACKAGES.txt" ]]; then cat "$dir/PACKAGES.txt"; fi

      # Imports vcvars into later steps, including Bash, without a shell bridge.
      - name: Set up the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install NASM
        run: |
          temp="$(cygpath -u "$RUNNER_TEMP")"
          zip="$temp/nasm.zip"
          dir="$temp/nasm"
          url="https://www.nasm.us/pub/nasm/releasebuilds/$NASM_VERSION/win64/nasm-$NASM_VERSION-win64.zip"
          curl --fail --location --retry 3 --output "$zip" "$url"
          7z x "$zip" "-o$(cygpath -w "$dir")" -y
          nasm="$dir/nasm-$NASM_VERSION/nasm.exe"
          [[ -f "$nasm" ]] || { echo "nasm.exe is missing at $nasm" >&2; exit 1; }
          echo "NASM=$(cygpath -m "$nasm")" >> "$GITHUB_ENV"
          "$nasm" -v

      - name: Build xvidcore
        run: |
          temp="$(cygpath -u "$RUNNER_TEMP")"
          root="$temp/xvidcore"
          tag="release-${XVIDCORE_VERSION//./_}"
          git clone --depth 1 --branch "$tag" https://github.com/arthenica/xvidcore.git "$root"
          obj="$temp/xvid-obj"
          mkdir -p "$obj"

          # The C sources, from build/generic/sources.inc.
          c=(
            decoder.c encoder.c xvid.c
            bitstream/bitstream.c bitstream/cbp.c bitstream/mbcoding.c
            dct/fdct.c dct/idct.c dct/simple_idct.c
            image/colorspace.c image/image.c image/interpolate8x8.c
            image/font.c image/postprocessing.c image/qpel.c image/reduced.c
            motion/estimation_bvop.c motion/estimation_common.c motion/estimation_gmc.c
            motion/estimation_pvop.c motion/estimation_rd_based.c
            motion/estimation_rd_based_bvop.c motion/gmc.c motion/motion_comp.c
            motion/vop_type_decision.c motion/sad.c
            prediction/mbprediction.c
            plugins/plugin_single.c plugins/plugin_2pass1.c plugins/plugin_2pass2.c
            plugins/plugin_lumimasking.c plugins/plugin_dump.c plugins/plugin_psnr.c
            plugins/plugin_ssim.c plugins/plugin_psnrhvsm.c
            quant/quant_h263.c quant/quant_matrix.c quant/quant_mpeg.c
            utils/emms.c utils/mbtransquant.c utils/mem_align.c
            utils/mem_transfer.c utils/timer.c
          )
          # Disable MSYS argument conversion so /O2 and /Fo reach MSVC unchanged.
          export MSYS_NO_PATHCONV=1
          cd "$root"
          cl.exe /nologo /std:c11 /c "/Ixvidcore/src" \
            "/Fo$(cygpath -w "$temp/xvid-layout.obj")" \
            "$(cygpath -w "$GITHUB_WORKSPACE/.github/scripts/xvid-layout.c")"
          for f in "${c[@]}"; do
            out="$obj/${f//\//_}"
            cl.exe /nologo /c /O2 /MD /DWIN32 /D_WINDOWS /DARCH_IS_X86_64 \
              /DARCH_IS_64BIT /D_CRT_SECURE_NO_WARNINGS /DNDEBUG \
              "/Fo$(cygpath -w "${out%.c}.obj")" "$(cygpath -w "xvidcore/src/$f")"
          done

          # The assembly, from the same sources file.
          asm=(
            bitstream/x86_asm/cbp_mmx.asm bitstream/x86_asm/cbp_sse2.asm
            dct/x86_asm/fdct_mmx_ffmpeg.asm dct/x86_asm/fdct_mmx_skal.asm
            dct/x86_asm/fdct_sse2_skal.asm dct/x86_asm/idct_3dne.asm
            dct/x86_asm/idct_mmx.asm dct/x86_asm/idct_sse2_dmitry.asm
            image/x86_asm/colorspace_rgb_mmx.asm image/x86_asm/colorspace_yuv_mmx.asm
            image/x86_asm/colorspace_yuyv_mmx.asm image/x86_asm/interpolate8x8_3dn.asm
            image/x86_asm/interpolate8x8_3dne.asm image/x86_asm/interpolate8x8_mmx.asm
            image/x86_asm/interpolate8x8_xmm.asm image/x86_asm/postprocessing_mmx.asm
            image/x86_asm/postprocessing_sse2.asm image/x86_asm/reduced_mmx.asm
            image/x86_asm/qpel_mmx.asm image/x86_asm/gmc_mmx.asm
            image/x86_asm/deintl_sse.asm
            motion/x86_asm/sad_xmm.asm motion/x86_asm/sad_sse2.asm
            motion/x86_asm/sad_mmx.asm motion/x86_asm/sad_3dne.asm
            motion/x86_asm/sad_3dn.asm
            quant/x86_asm/quantize_h263_mmx.asm quant/x86_asm/quantize_h263_3dne.asm
            quant/x86_asm/quantize_mpeg_xmm.asm quant/x86_asm/quantize_mpeg_mmx.asm
            utils/x86_asm/mem_transfer_mmx.asm utils/x86_asm/mem_transfer_3dne.asm
            utils/x86_asm/interlacing_mmx.asm utils/x86_asm/cpuid.asm
            plugins/x86_asm/plugin_ssim-a.asm
          )
          for f in "${asm[@]}"; do
            src="xvidcore/src/$f"
            out="$obj/${f//\//_}"
            # WINDOWS selects the MS calling convention; NO_PREFIX omits '_'.
            "$NASM" "-I$(cygpath -m "$(dirname "$src")")/" "-I$(cygpath -m xvidcore/src)/" \
              -f win64 -DWINDOWS -DNO_PREFIX -DARCH_IS_X86_64 \
              "$(cygpath -w "$src")" -o "$(cygpath -w "${out%.asm}.obj")"
          done

          objects=()
          for f in "$obj"/*.obj; do objects+=("$(cygpath -w "$f")"); done
          lib.exe /nologo "/OUT:$(cygpath -w "$temp/xvidcore.lib")" "${objects[@]}"
          echo 'xvidcore.lib built'

      - name: Build genkfr
        run: |
          # Native paths are needed by Rust, not Git Bash's /c/... paths.
          export FFMPEG_DIR="$(cygpath -m "$RUNNER_TEMP")/ffmpeg"
          # Cargo's unit separator preserves paths containing spaces.
          export CARGO_ENCODED_RUSTFLAGS="-L"$'\x1f'"native=$(cygpath -m "$RUNNER_TEMP")"
          # Git Bash's link.exe is not the MSVC linker.
          export CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER="$(cygpath -m "$VCToolsInstallDir")/bin/Hostx64/x64/link.exe"
          cargo build --release
          mkdir -p out
          cp target/release/genkfr.exe out/genkfr.exe

      - name: Check that the executable is self-contained
        run: |
          dump="$(MSYS_NO_PATHCONV=1 dumpbin.exe /dependents out/genkfr.exe)"
          echo "$dump"
          if grep -Ei 'avcodec|avformat|avutil|swscale|swresample|ffms2|xvidcore' <<< "$dump"; then
            echo 'genkfr.exe still needs a non-system DLL' >&2
            exit 1
          fi
          echo "size: $(wc -c < out/genkfr.exe) bytes"

      - uses: actions/upload-artifact@v7
        with:
          name: genkfr-win-x64
          path: out/genkfr.exe
          if-no-files-found: error

  release:
    name: Publish the release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v-')

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package
        run: |
          name="genkfr-$GITHUB_REF_NAME-windows-x64"
          pkg="dist/$name"
          mkdir -p "$pkg"
          cp artifacts/genkfr-win-x64/genkfr.exe README.md "$pkg/"
          rm -f "dist/$name.zip"
          (cd dist && 7z a -tzip "$name.zip" "$name")

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
