name: Windows Release

# Builds a single genkfr.exe with no DLL files beside it.
#
# The dependencies are built from source and linked statically:
#   - FFmpeg, from vcpkg (x64-windows-static-md)
#   - FFMS2, compiled here from its own sources against that FFmpeg
#   - xvidcore, compiled here from its own sources
#
# FFMS2 ships a Visual Studio project, but it also pulls in AviSynth and
# VapourSynth. GenKFR uses neither, so the workflow compiles the 14 files of
# FFMS2's core directly. That keeps the build small and readable.

on:
  push:
    tags:
      - 'v-*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned so the build does not change under us.
  FFMS2_VERSION: '5.0'
  XVIDCORE_VERSION: '1.3.7'
  # vcpkg is already installed on the GitHub Windows runners.
  VCPKG_ROOT: 'C:\vcpkg'

jobs:
  build:
    name: Build genkfr
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # FFmpeg takes a long time to build. The cache turns a 1-2 hour build into
      # a download on every run after the first.
      - name: Restore the vcpkg cache
        uses: actions/cache@v4
        with:
          path: C:\vcpkg\installed
          key: vcpkg-static-md-${{ runner.os }}-${{ hashFiles('.github/workflows/windows-release.yml') }}

      - name: Install static FFmpeg
        shell: pwsh
        run: |
          # The -md triplet links the C runtime dynamically, which is what
          # Rust uses. The plain x64-windows-static triplet uses a static CRT
          # and fails to link against a Rust binary.
          #
          # avcodec, avformat and swscale are what FFMS2 and GenKFR use.
          # avutil is always built and has no feature of its own. avdevice and
          # avfilter are left out.
          # zlib compresses the FFMS2 index (src/core/zipfile.cpp).
          C:\vcpkg\vcpkg.exe install "ffmpeg[avcodec,avformat,swscale,swresample,zlib]:x64-windows-static-md"
          C:\vcpkg\vcpkg.exe integrate install

      - name: Build xvidcore
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'xvidcore'
          # The tag is immutable, unlike the release-1_3-branch.
          git clone --depth 1 --branch "release-$($env:XVIDCORE_VERSION -replace '\.','_')" `
            https://github.com/arthenica/xvidcore.git $root

          # NASM builds the assembly. The runner has it.
          $nasm = (Get-Command nasm -ErrorAction SilentlyContinue).Source
          if (-not $nasm) { throw 'nasm is missing' }

          $src = Join-Path $root 'xvidcore\src'
          $obj = Join-Path $env:RUNNER_TEMP 'xvid-obj'
          New-Item -ItemType Directory -Force -Path $obj | Out-Null

          # The C sources, from build/generic/sources.inc.
          $c = @(
            'decoder.c','encoder.c','xvid.c',
            'bitstream\bitstream.c','bitstream\cbp.c','bitstream\mbcoding.c',
            'dct\fdct.c','dct\idct.c','dct\simple_idct.c',
            'image\colorspace.c','image\image.c','image\interpolate8x8.c',
            'image\font.c','image\postprocessing.c','image\qpel.c','image\reduced.c',
            'motion\estimation_bvop.c','motion\estimation_common.c','motion\estimation_gmc.c',
            'motion\estimation_pvop.c','motion\estimation_rd_based.c',
            'motion\estimation_rd_based_bvop.c','motion\gmc.c','motion\motion_comp.c',
            'motion\vop_type_decision.c','motion\sad.c',
            'prediction\mbprediction.c',
            'plugins\plugin_single.c','plugins\plugin_2pass1.c','plugins\plugin_2pass2.c',
            'plugins\plugin_lumimasking.c','plugins\plugin_dump.c','plugins\plugin_psnr.c',
            'plugins\plugin_ssim.c','plugins\plugin_psnrhvsm.c',
            'quant\quant_h263.c','quant\quant_matrix.c','quant\quant_mpeg.c',
            'utils\emms.c','utils\mbtransquant.c','utils\mem_align.c',
            'utils\mem_transfer.c','utils\timer.c'
          )
          $defs = '/nologo','/c','/O2','/DWIN32','/D_WINDOWS','/DARCH_IS_X86_64',
                  '/DARCH_IS_64BIT','/D_CRT_SECURE_NO_WARNINGS','/DNDEBUG'
          Push-Location $root
          foreach ($f in $c) {
            & cl.exe @defs "/Fo$obj\" "xvidcore\src\$f"
            if ($LASTEXITCODE -ne 0) { throw "cl failed on $f" }
          }

          # The assembly, from the same sources file.
          $asm = @(
            'bitstream\x86_asm\cbp_mmx.asm','bitstream\x86_asm\cbp_sse2.asm',
            'dct\x86_asm\fdct_mmx_ffmpeg.asm','dct\x86_asm\fdct_mmx_skal.asm',
            'dct\x86_asm\fdct_sse2_skal.asm','dct\x86_asm\idct_3dne.asm',
            'dct\x86_asm\idct_mmx.asm','dct\x86_asm\idct_sse2_dmitry.asm',
            'image\x86_asm\colorspace_rgb_mmx.asm','image\x86_asm\colorspace_yuv_mmx.asm',
            'image\x86_asm\colorspace_yuyv_mmx.asm','image\x86_asm\interpolate8x8_3dn.asm',
            'image\x86_asm\interpolate8x8_3dne.asm','image\x86_asm\interpolate8x8_mmx.asm',
            'image\x86_asm\interpolate8x8_xmm.asm','image\x86_asm\postprocessing_mmx.asm',
            'image\x86_asm\postprocessing_sse2.asm','image\x86_asm\reduced_mmx.asm',
            'image\x86_asm\qpel_mmx.asm','image\x86_asm\gmc_mmx.asm',
            'image\x86_asm\deintl_sse.asm',
            'motion\x86_asm\sad_xmm.asm','motion\x86_asm\sad_sse2.asm',
            'motion\x86_asm\sad_mmx.asm','motion\x86_asm\sad_3dne.asm',
            'motion\x86_asm\sad_3dn.asm',
            'quant\x86_asm\quantize_h263_mmx.asm','quant\x86_asm\quantize_h263_3dne.asm',
            'quant\x86_asm\quantize_mpeg_xmm.asm','quant\x86_asm\quantize_mpeg_mmx.asm',
            'utils\x86_asm\mem_transfer_mmx.asm','utils\x86_asm\mem_transfer_3dne.asm',
            'utils\x86_asm\interlacing_mmx.asm','utils\x86_asm\cpuid.asm',
            'plugins\x86_asm\plugin_ssim-a.asm'
          )
          foreach ($f in $asm) {
            $dir = Split-Path "xvidcore\src\$f" -Parent
            # -DWINDOWS selects the Microsoft calling convention in nasm.inc.
            # -DNO_PREFIX stops it from adding a leading underscore, which the
            # C objects do not have.
            & $nasm -I"$dir\" -I"xvidcore\src\" -f win64 -DWINDOWS -DNO_PREFIX `
              -DARCH_IS_X86_64 "xvidcore\src\$f" -o "$obj\$(($f -replace '[\\/]','_') -replace '\.asm$','.obj')"
            if ($LASTEXITCODE -ne 0) { throw "nasm failed on $f" }
          }
          Pop-Location

          & lib.exe /nologo "/OUT:$env:RUNNER_TEMP\xvidcore.lib" "$obj\*.obj"
          if ($LASTEXITCODE -ne 0) { throw 'lib failed for xvidcore' }

      - name: Build FFMS2
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ffms2'
          git clone --depth 1 --branch $env:FFMS2_VERSION `
            https://github.com/FFMS/ffms2.git $root

          # GenKFR needs the core only. The vcxproj in the repository also
          # builds the AviSynth and VapourSynth plugins, which are not used.
          $inc = 'C:\vcpkg\installed\x64-windows-static-md\include'
          $lib = 'C:\vcpkg\installed\x64-windows-static-md\lib'
          $obj = Join-Path $env:RUNNER_TEMP 'ffms-obj'
          New-Item -ItemType Directory -Force -Path $obj | Out-Null

          Push-Location $root
          $defs = '/nologo','/c','/O2','/EHsc','/std:c++17','/DNDEBUG','/D_CRT_SECURE_NO_WARNINGS',
                  "/I$root\include","/I$inc"
          Get-ChildItem 'src\core\*.cpp' | ForEach-Object {
            & cl.exe @defs "/Fo$obj\" $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "cl failed on $($_.Name)" }
          }
          Pop-Location

          # FFMS2 is C++ and needs the C++ runtime, which the static triplet uses.
          & lib.exe /nologo "/OUT:$env:RUNNER_TEMP\ffms2.lib" "$obj\*.obj"
          if ($LASTEXITCODE -ne 0) { throw 'lib failed for FFMS2' }

      - name: Build genkfr
        shell: pwsh
        run: |
          $vcpkg = 'C:\vcpkg\installed\x64-windows-static-md\lib'
          $env:RUSTFLAGS = "-L native=$env:RUNNER_TEMP -L native=$vcpkg"
          # FFMS2 needs FFmpeg, and FFmpeg needs these system libraries.
          $env:RUSTFLAGS += " -C link-arg=bcrypt.lib -C link-arg=ws2_32.lib"
          $env:RUSTFLAGS += " -C link-arg=secur32.lib -C link-arg=mfplat.lib"
          $env:RUSTFLAGS += " -C link-arg=mfuuid.lib -C link-arg=strmiids.lib"
          $env:RUSTFLAGS += " -C link-arg=ole32.lib -C link-arg=user32.lib"
          $env:RUSTFLAGS += " -C link-arg=crypt32.lib -C link-arg=psapi.lib"
          $env:RUSTFLAGS += " -C link-arg=uuid.lib -C link-arg=oleaut32.lib"
          $env:RUSTFLAGS += " -C link-arg=shlwapi.lib -C link-arg=gdi32.lib"
          $env:RUSTFLAGS += " -C link-arg=vfw32.lib"
          # FFMS2 compresses its index with zlib.
          $env:RUSTFLAGS += " -C link-arg=zlib.lib"

          cargo build --release --verbose

          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item target/release/genkfr.exe out/genkfr.exe -Force

      - name: Check that the executable is self-contained
        shell: pwsh
        run: |
          # A dependency on an FFmpeg or FFMS2 DLL would mean the static link
          # failed. System DLLs are expected.
          $exe = 'out\genkfr.exe'
          $dump = & dumpbin /dependents $exe
          Write-Output $dump
          $bad = $dump | Select-String -Pattern 'avcodec|avformat|avutil|swscale|swresample|ffms2|xvidcore'
          if ($bad) { throw "genkfr.exe still needs: $bad" }

          Write-Output "size: $((Get-Item $exe).Length) bytes"

      - uses: actions/upload-artifact@v7
        with:
          name: genkfr-win-x64
          path: out/genkfr.exe
          if-no-files-found: error

  release:
    name: Publish the release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v-')

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pkg = Join-Path $pwd "dist/genkfr-$tag-windows-x64"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item artifacts/genkfr-win-x64/genkfr.exe $pkg -Force
          Copy-Item README.md $pkg -Force

          $zip = Join-Path $pwd "dist/genkfr-$tag-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $pkg -DestinationPath $zip -Force

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
