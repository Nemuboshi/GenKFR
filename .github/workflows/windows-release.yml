name: Windows Release

# Builds a single genkfr.exe with no DLL files beside it.
#
# FFmpeg comes from vcpkg as static libraries. Everything else is built from
# source in this workflow:
#   - FFMS2, from the sources vendored in vendor/ffms2. build.rs compiles them.
#   - xvidcore, from its own repository.
#
# FFMS2 is normally built as a DLL, and its repository also builds AviSynth and
# VapourSynth plugins. GenKFR uses neither, so the core sources are vendored and
# compiled by cargo.

on:
  push:
    tags:
      - 'v-*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # Pinned so the build does not change under us.
  XVIDCORE_VERSION: '1.3.7'
  NASM_VERSION: '2.16.03'
  # vcpkg is preinstalled at C:\vcpkg on the GitHub Windows runners.
  #
  # The vcpkg binary cache stores one zip per installed package, not the whole
  # installed tree. That is much smaller, and vcpkg writes it as it goes, so the
  # FFmpeg build is not repeated.
  VCPKG_BINARY_SOURCES: 'files,C:\vcpkg-cache,readwrite'
  # A release-only triplet. vcpkg builds debug and release by default, which
  # doubles the FFmpeg build time for libraries that are never linked.
  VCPKG_OVERLAY_TRIPLETS: '${{ github.workspace }}\.github\triplets'
  TRIPLET: 'x64-windows-static-md-release'
  # Fixed, so that editing this workflow does not throw the cache away.
  VCPKG_CACHE_VERSION: 'v1'

jobs:
  build:
    name: Build genkfr
    runs-on: windows-latest

    steps:
      # The FFMS2 submodule holds the sources that build.rs compiles.
      - uses: actions/checkout@v6
        with:
          submodules: true

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      # Only the per-package zips, not the multi-gigabyte installed tree.
      # Restore and save are separate so the cache is written even when a later
      # step fails.
      - name: Restore the vcpkg binary cache
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-bincache-${{ env.VCPKG_CACHE_VERSION }}-${{ runner.os }}
          restore-keys: |
            vcpkg-bincache-${{ runner.os }}-

      - name: Install static FFmpeg
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\vcpkg\vcpkg.exe')) { throw 'vcpkg is not at C:\vcpkg' }
          New-Item -ItemType Directory -Force -Path 'C:\vcpkg-cache' | Out-Null

          # The -md triplet links the C runtime dynamically, which is what Rust
          # uses. A static CRT fails to link against a Rust binary.
          #
          # avcodec, avformat and swscale are what FFMS2 and GenKFR use. avutil
          # is always built and has no feature of its own. avdevice and avfilter
          # are left out. zlib compresses the FFMS2 index (zipfile.cpp).
          C:\vcpkg\vcpkg.exe install "ffmpeg[avcodec,avformat,swscale,swresample,zlib]:$env:TRIPLET"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg install failed' }
          C:\vcpkg\vcpkg.exe integrate install

      # Save as soon as FFmpeg exists, so a later failure still caches it.
      - name: Save the vcpkg binary cache
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\vcpkg-cache
          key: vcpkg-bincache-${{ env.VCPKG_CACHE_VERSION }}-${{ runner.os }}

      # The runner does not put MSVC on PATH. Import the environment that
      # vcvars64.bat sets, once, for every later step.
      - name: Set up the MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (-not (Test-Path $vswhere)) { throw 'vswhere.exe is missing' }
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -property installationPath
          if (-not $vs) { throw 'no Visual Studio with the C++ tools' }
          $vcvars = Join-Path $vs 'VC\Auxiliary\Build\vcvars64.bat'
          if (-not (Test-Path $vcvars)) { throw "vcvars64.bat is missing at $vcvars" }

          cmd /c "`"$vcvars`" >nul 2>&1 && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              Add-Content -Path $env:GITHUB_ENV -Value "$($Matches[1])=$($Matches[2])"
            }
          }
          Write-Output "VS at $vs"

      - name: Install NASM
        shell: pwsh
        run: |
          # xvidcore needs an assembler for its 35 assembly files. The runner
          # does not ship one.
          $zip = Join-Path $env:RUNNER_TEMP 'nasm.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'nasm'
          $url = "https://www.nasm.us/pub/nasm/releasebuilds/$env:NASM_VERSION/win64/nasm-$env:NASM_VERSION-win64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          $nasm = Join-Path $dir "nasm-$env:NASM_VERSION\nasm.exe"
          if (-not (Test-Path $nasm)) { throw "nasm.exe is missing at $nasm" }
          Add-Content -Path $env:GITHUB_ENV -Value "NASM=$nasm"
          & $nasm -v

      - name: Build xvidcore
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'xvidcore'
          $tag = "release-$($env:XVIDCORE_VERSION -replace '\.','_')"
          # The tag is immutable, unlike the release-1_3-branch.
          git clone --depth 1 --branch $tag https://github.com/arthenica/xvidcore.git $root
          if ($LASTEXITCODE -ne 0) { throw "cannot clone xvidcore $tag" }

          $obj = Join-Path $env:RUNNER_TEMP 'xvid-obj'
          New-Item -ItemType Directory -Force -Path $obj | Out-Null

          # The C sources, from build/generic/sources.inc.
          $c = @(
            'decoder.c','encoder.c','xvid.c',
            'bitstream\bitstream.c','bitstream\cbp.c','bitstream\mbcoding.c',
            'dct\fdct.c','dct\idct.c','dct\simple_idct.c',
            'image\colorspace.c','image\image.c','image\interpolate8x8.c',
            'image\font.c','image\postprocessing.c','image\qpel.c','image\reduced.c',
            'motion\estimation_bvop.c','motion\estimation_common.c','motion\estimation_gmc.c',
            'motion\estimation_pvop.c','motion\estimation_rd_based.c',
            'motion\estimation_rd_based_bvop.c','motion\gmc.c','motion\motion_comp.c',
            'motion\vop_type_decision.c','motion\sad.c',
            'prediction\mbprediction.c',
            'plugins\plugin_single.c','plugins\plugin_2pass1.c','plugins\plugin_2pass2.c',
            'plugins\plugin_lumimasking.c','plugins\plugin_dump.c','plugins\plugin_psnr.c',
            'plugins\plugin_ssim.c','plugins\plugin_psnrhvsm.c',
            'quant\quant_h263.c','quant\quant_matrix.c','quant\quant_mpeg.c',
            'utils\emms.c','utils\mbtransquant.c','utils\mem_align.c',
            'utils\mem_transfer.c','utils\timer.c'
          )
          # WIN32 selects the Windows headers and the thread shims in portab.h.
          $defs = @('/nologo','/c','/O2','/DWIN32','/D_WINDOWS','/DARCH_IS_X86_64',
                    '/DARCH_IS_64BIT','/D_CRT_SECURE_NO_WARNINGS','/DNDEBUG')

          Push-Location $root
          try {
            foreach ($f in $c) {
              & cl.exe @defs "/Fo$obj\" "xvidcore\src\$f"
              if ($LASTEXITCODE -ne 0) { throw "cl failed on $f" }
            }

            # The assembly, from the same sources file.
            $asm = @(
              'bitstream\x86_asm\cbp_mmx.asm','bitstream\x86_asm\cbp_sse2.asm',
              'dct\x86_asm\fdct_mmx_ffmpeg.asm','dct\x86_asm\fdct_mmx_skal.asm',
              'dct\x86_asm\fdct_sse2_skal.asm','dct\x86_asm\idct_3dne.asm',
              'dct\x86_asm\idct_mmx.asm','dct\x86_asm\idct_sse2_dmitry.asm',
              'image\x86_asm\colorspace_rgb_mmx.asm','image\x86_asm\colorspace_yuv_mmx.asm',
              'image\x86_asm\colorspace_yuyv_mmx.asm','image\x86_asm\interpolate8x8_3dn.asm',
              'image\x86_asm\interpolate8x8_3dne.asm','image\x86_asm\interpolate8x8_mmx.asm',
              'image\x86_asm\interpolate8x8_xmm.asm','image\x86_asm\postprocessing_mmx.asm',
              'image\x86_asm\postprocessing_sse2.asm','image\x86_asm\reduced_mmx.asm',
              'image\x86_asm\qpel_mmx.asm','image\x86_asm\gmc_mmx.asm',
              'image\x86_asm\deintl_sse.asm',
              'motion\x86_asm\sad_xmm.asm','motion\x86_asm\sad_sse2.asm',
              'motion\x86_asm\sad_mmx.asm','motion\x86_asm\sad_3dne.asm',
              'motion\x86_asm\sad_3dn.asm',
              'quant\x86_asm\quantize_h263_mmx.asm','quant\x86_asm\quantize_h263_3dne.asm',
              'quant\x86_asm\quantize_mpeg_xmm.asm','quant\x86_asm\quantize_mpeg_mmx.asm',
              'utils\x86_asm\mem_transfer_mmx.asm','utils\x86_asm\mem_transfer_3dne.asm',
              'utils\x86_asm\interlacing_mmx.asm','utils\x86_asm\cpuid.asm',
              'plugins\x86_asm\plugin_ssim-a.asm'
            )
            foreach ($f in $asm) {
              $src = "xvidcore\src\$f"
              $dir = Split-Path $src -Parent
              $out = Join-Path $obj (($f -replace '[\\/]','_') -replace '\.asm$','.obj')
              # -DWINDOWS selects the Microsoft calling convention in nasm.inc.
              # -DNO_PREFIX stops it from adding a leading underscore, which the
              # C objects do not have.
              & $env:NASM -I"$dir\" -I"xvidcore\src\" -f win64 -DWINDOWS -DNO_PREFIX `
                -DARCH_IS_X86_64 $src -o $out
              if ($LASTEXITCODE -ne 0) { throw "nasm failed on $f" }
            }
          } finally {
            Pop-Location
          }

          & lib.exe /nologo "/OUT:$env:RUNNER_TEMP\xvidcore.lib" "$obj\*.obj"
          if ($LASTEXITCODE -ne 0) { throw 'lib failed for xvidcore' }
          Write-Output "xvidcore.lib built"

      - name: Build genkfr
        shell: pwsh
        run: |
          # build.rs compiles the vendored FFMS2 core and finds FFmpeg through
          # FFMPEG_DIR. xvidcore is found through RUSTFLAGS.
          $env:FFMPEG_DIR = "C:\vcpkg\installed\$env:TRIPLET"
          $env:RUSTFLAGS = "-L native=$env:RUNNER_TEMP"

          cargo build --release
          if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }

          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item target/release/genkfr.exe out/genkfr.exe -Force

      - name: Check that the executable is self-contained
        shell: pwsh
        run: |
          # A dependency on an FFmpeg or FFMS2 DLL would mean the static link
          # failed. System DLLs are expected.
          $exe = 'out\genkfr.exe'
          $dump = & dumpbin /dependents $exe
          Write-Output $dump
          $bad = $dump | Select-String -Pattern 'avcodec|avformat|avutil|swscale|swresample|ffms2|xvidcore'
          if ($bad) { throw "genkfr.exe still needs: $bad" }
          Write-Output "size: $((Get-Item $exe).Length) bytes"

      - uses: actions/upload-artifact@v7
        with:
          name: genkfr-win-x64
          path: out/genkfr.exe
          if-no-files-found: error

  release:
    name: Publish the release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v-')

    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $pkg = Join-Path $pwd "dist/genkfr-$tag-windows-x64"
          New-Item -ItemType Directory -Force -Path $pkg | Out-Null
          Copy-Item artifacts/genkfr-win-x64/genkfr.exe $pkg -Force
          Copy-Item README.md $pkg -Force

          $zip = Join-Path $pwd "dist/genkfr-$tag-windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path $pkg -DestinationPath $zip -Force

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.zip
