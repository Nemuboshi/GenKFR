name: FFmpeg Static Libraries

# Builds the static FFmpeg libraries that genkfr links, and publishes them as a
# release asset.
#
# The build takes about 15 minutes, so the result is kept in a release rather
# than in the actions cache. A release asset does not expire, and it can be
# checked before the build starts: if the asset for this version already
# exists, nothing is rebuilt.
#
# Run this by hand when a new FFmpeg version is wanted. windows-release.yml
# only downloads the asset, it never builds FFmpeg, so a missing release makes
# that workflow fail until you run this one.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the asset, for example 9.0.2'
        required: true
        default: '9.0.2'
  workflow_call:
    inputs:
      version:
        description: 'Version label for the asset'
        required: true
        type: string
    outputs:
      tag:
        description: 'The release tag that holds the libraries'
        value: ${{ jobs.libs.outputs.tag }}

permissions:
  contents: write

env:
  # A release-only triplet. vcpkg builds debug and release by default, which
  # doubles the FFmpeg build time for libraries that are never linked.
  VCPKG_OVERLAY_TRIPLETS: '${{ github.workspace }}\.github\triplets'
  TRIPLET: 'x64-windows-static-md-release'

jobs:
  libs:
    name: Build FFmpeg static libraries
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      built: ${{ steps.existing.outputs.found != 'true' }}

    steps:
      - uses: actions/checkout@v6

      - name: Work out the release tag
        id: tag
        shell: pwsh
        run: |
          $tag = "ffmpeg-libs-${{ inputs.version }}"
          Write-Output "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Output "asset=$tag.zip" >> $env:GITHUB_OUTPUT
          Write-Output "Using tag $tag"

      # If the asset is already published, stop here. The caller downloads it.
      - name: Look for an existing asset
        id: existing
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          # gh writes to stderr when the release is absent, so test the exit code.
          $found = & gh release view $tag --json assets 2>$null | ConvertFrom-Json
          if ($LASTEXITCODE -eq 0 -and $found.assets.Count -gt 0) {
            Write-Output "found=true" >> $env:GITHUB_OUTPUT
            Write-Output "release $tag already holds $($found.assets.Count) asset(s), nothing to build"
          } else {
            Write-Output "found=false" >> $env:GITHUB_OUTPUT
            Write-Output "release $tag does not exist yet, the libraries will be built"
          }

      - name: Install static FFmpeg
        if: steps.existing.outputs.found != 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\vcpkg\vcpkg.exe')) { throw 'vcpkg is not at C:\vcpkg' }

          # The -md triplet links the C runtime dynamically, which is what Rust
          # uses. A static CRT fails to link against a Rust binary.
          #
          # avcodec, avformat and swscale are what FFMS2 and genkfr use. avutil
          # is always built and has no feature of its own. avdevice and avfilter
          # are left out. zlib compresses the FFMS2 index.
          C:\vcpkg\vcpkg.exe install "ffmpeg[avcodec,avformat,swscale,swresample,zlib]:$env:TRIPLET"
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg install failed' }

      - name: Package the libraries
        if: steps.existing.outputs.found != 'true'
        shell: pwsh
        run: |
          $installed = "C:\vcpkg\installed\$env:TRIPLET"
          if (-not (Test-Path "$installed\lib")) { throw "no libraries at $installed\lib" }

          # Only what a consumer needs: headers and libraries. The installed tree
          # also holds share/, debug/ and the vcpkg metadata, which are not used.
          $staging = Join-Path $env:RUNNER_TEMP 'ffmpeg-libs'
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item "$installed\include" (Join-Path $staging 'include') -Recurse
          Copy-Item "$installed\lib" (Join-Path $staging 'lib') -Recurse

          # A record of what is inside, so a consumer can tell what it got.
          $versions = & C:\vcpkg\vcpkg.exe list 2>$null
          $versions | Set-Content (Join-Path $staging 'PACKAGES.txt')

          $zip = Join-Path $pwd "${{ steps.tag.outputs.asset }}"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "$staging\*" -DestinationPath $zip -Force

          $mb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          Write-Output "packed $zip, $mb MB"
          if ($mb -lt 1) { throw 'the archive is suspiciously small' }

      - name: Publish the asset
        if: steps.existing.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 'FFmpeg static libraries ${{ inputs.version }}'
          body: |
            Static FFmpeg libraries for building genkfr.

            Built by the `FFmpeg Static Libraries` workflow from the vcpkg port.
            Contents: `include/`, `lib/` and `PACKAGES.txt`.

            This release is a build input, not a program release.
          files: ${{ steps.tag.outputs.asset }}
