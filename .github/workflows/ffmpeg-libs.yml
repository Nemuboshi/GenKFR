name: FFmpeg Static Libraries

# Builds the static FFmpeg libraries that genkfr links, and publishes them as a
# release asset. Existing assets are reused rather than rebuilt.
# windows-release.yml starts this workflow when its asset is missing.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the asset, for example 9.0.2'
        required: true
        default: '9.0.2'
  workflow_call:
    inputs:
      version:
        description: 'Version label for the asset'
        required: true
        type: string
    outputs:
      tag:
        description: 'The release tag that holds the libraries'
        value: ${{ jobs.libs.outputs.tag }}

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  # Build release libraries only, with the dynamic CRT that Rust uses.
  VCPKG_OVERLAY_TRIPLETS: '${{ github.workspace }}/.github/triplets'
  TRIPLET: 'x64-windows-static-md-release'

jobs:
  libs:
    name: Build FFmpeg static libraries
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      built: ${{ steps.existing.outputs.found != 'true' }}

    steps:
      - uses: actions/checkout@v6

      - name: Test release asset lookup
        run: bash .github/scripts/test-ffmpeg-asset.sh

      - name: Work out the release tag
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$VERSION" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || { echo 'invalid FFmpeg version label' >&2; exit 1; }
          tag="ffmpeg-libs-$VERSION"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "asset=$tag.zip" >> "$GITHUB_OUTPUT"
          echo "Using tag $tag"

      # If the asset is already published, stop here. The caller downloads it.
      - name: Look for an existing asset
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          found="$(bash .github/scripts/ffmpeg-asset.sh "$TAG")"
          echo "found=$found" >> "$GITHUB_OUTPUT"
          echo "release $TAG: expected asset found=$found"

      - name: Install static FFmpeg
        if: steps.existing.outputs.found != 'true'
        run: |
          [[ -f /c/vcpkg/vcpkg.exe ]] || { echo 'vcpkg is not at C:/vcpkg' >&2; exit 1; }

          # avutil is always built. zlib compresses the FFMS2 index.
          /c/vcpkg/vcpkg.exe install "ffmpeg[avcodec,avformat,swscale,swresample,zlib]:$TRIPLET"

      - name: Package the libraries
        if: steps.existing.outputs.found != 'true'
        env:
          ASSET: ${{ steps.tag.outputs.asset }}
        run: |
          installed="/c/vcpkg/installed/$TRIPLET"
          [[ -d "$installed/lib" ]] || { echo "no libraries at $installed/lib" >&2; exit 1; }

          # Only headers, libraries and a record of the package versions.
          staging="$(cygpath -u "$RUNNER_TEMP")/ffmpeg-libs"
          rm -rf "$staging"
          mkdir -p "$staging"
          cp -R "$installed/include" "$installed/lib" "$staging/"
          /c/vcpkg/vcpkg.exe list > "$staging/PACKAGES.txt"

          zip="$(pwd)/$ASSET"
          rm -f "$zip"
          (cd "$staging" && 7z a -tzip "$(cygpath -w "$zip")" .)
          bytes="$(wc -c < "$zip")"
          echo "packed $zip, $bytes bytes"
          (( bytes >= 1048576 )) || { echo 'the archive is suspiciously small' >&2; exit 1; }

      - name: Publish the asset
        if: steps.existing.outputs.found != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: 'FFmpeg static libraries ${{ inputs.version }}'
          body: |
            Static FFmpeg libraries for building genkfr.

            Built by the `FFmpeg Static Libraries` workflow from the vcpkg port.
            Contents: `include/`, `lib/` and `PACKAGES.txt`.

            This release is a build input, not a program release.
          files: ${{ steps.tag.outputs.asset }}
