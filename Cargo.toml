[package]
name = "genkfr"
version = "0.1.0"
edition = "2024"

[workspace]
members = ["crates/genkfr-media"]
default-members = [".", "crates/genkfr-media"]
resolver = "3"

[dependencies]
anyhow = "1"
genkfr-media = { path = "crates/genkfr-media" }

[profile.release]
lto = true
codegen-units = 1

[[bin]]
name = "genkfr"
path = "src/main.rs"
